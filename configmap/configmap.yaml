apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-config
data:
  MYSQL_HOST: "mysql.dev.local"
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: "mydb"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-app
  template:
    metadata:
      labels:
        app: mysql-app
    spec:
      containers:
        - name: app-container
          image: nginx   # replace with your app image
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: mysql-config
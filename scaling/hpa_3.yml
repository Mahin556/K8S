#For applications that need to respond quickly to traffic increases, configure aggressive scale-up policies.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nginx-deploy
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nginx-deploy

  minReplicas: 2
  maxReplicas: 20

  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50

  behavior:
    scaleUp:
      # Short stabilization for fast response
      stabilizationWindowSeconds: 30

      policies:
      # Allow doubling in first minute
      - type: Percent
        value: 100
        periodSeconds: 60

      # Allow adding 10 pods quickly
      - type: Pods
        value: 10
        periodSeconds: 30

      # Use the most aggressive policy
      selectPolicy: Max

# With this configuration, if CPU suddenly spikes, HPA can double the replica count over a 60-second window or add 10 pods within a 30-second window, providing fast scaling for traffic bursts.


apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: stranger-canary-route
  namespace: hawkins
spec:
  parentRefs:
  - name: stranger-gw
    namespace: str-gtw
  hostnames:
  - "api.stranger.things"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /recommendations
    backendRefs:
    - name: stv-v1
      port: 8080
      weight: 90
    - name: stv-v2
      port: 8080
      weight: 10

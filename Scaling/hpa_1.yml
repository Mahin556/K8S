apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nginx-deployment-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nginx-deployment

  minReplicas: 3
  maxReplicas: 10

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30 #default is 0 seconds
      policies:
        - type: Pods
          value: 1
          periodSeconds: 10

    scaleDown:
      stabilizationWindowSeconds: 30 #default is 300 seconds
      policies:
        - type: Pods
          value: 1
          periodSeconds: 20

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 10